<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 – Dark</title>
<style>
  :root{
    --bg:#0d0d14;
    --panel:#1b1b26;
    --muted:#8b8fa3;
    --text:#e8e9f3;
    --board:min(92vw, 74vh, 460px);
    --gap:calc(var(--board) * 0.028);
    --cell:calc((var(--board) - 5 * var(--gap)) / 4);
  }

  *{box-sizing:border-box;}

  html,body{height:100%;}

  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:radial-gradient(circle at 50% -10%, #1c1b33 0%, #0d0d14 55%, #08080d 100%);
    font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    overflow:hidden;
  }

  .app{width:var(--board);display:flex;flex-direction:column;}

  /* ---------- Kopf ---------- */
  .top{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:14px;
  }

  h1{
    margin:0;font-size:clamp(28px,8vw,44px);font-weight:900;letter-spacing:-2px;
    background:linear-gradient(135deg,#a78bfa,#f472b6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1;
  }
  .subtitle{margin:4px 0 0;font-size:11px;color:var(--muted);letter-spacing:.4px;}

  .scores{display:flex;gap:8px;}

  .score-box{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.06);
    border-radius:10px;
    padding:5px 14px;
    min-width:76px;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .score-box .label{
    font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);
  }
  .score-box .value{
    font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;
    display:inline-block;
  }

  @keyframes scorePop{
    0%{transform:scale(1);}
    45%{transform:scale(1.3);color:#a78bfa;}
    100%{transform:scale(1);}
  }
  .value.pop{animation:scorePop 240ms ease-out;}

  /* ---------- Leiste ---------- */
  .bar{display:flex;justify-content:flex-end;margin-bottom:12px;}

  button{
    font-family:inherit;
    background:linear-gradient(135deg,#7c5cff,#a855f7);
    color:#fff;border:none;border-radius:10px;
    padding:10px 18px;font-size:13.5px;font-weight:700;letter-spacing:.3px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(124,92,255,.35);
    transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
  }
  button:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,92,255,.45);}
  button:active{transform:translateY(1px) scale(.98);}

  /* ---------- Spielfeld ---------- */
  .board{
    position:relative;
    width:var(--board);
    height:var(--board);
    background:linear-gradient(160deg,#23232f,#191922);
    border:1px solid rgba(255,255,255,.07);
    border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    touch-action:none;
  }

  .grid{
    position:absolute;inset:0;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:var(--gap);
    padding:var(--gap);
  }
  .cell{
    background:rgba(255,255,255,.035);
    border-radius:calc(var(--cell) * 0.14);
  }

  .tiles{position:absolute;inset:0;}

  /* Kachel (Position) */
  .tile{
    position:absolute;
    top:0;left:0;
    width:var(--cell);
    height:var(--cell);
    transform:translate(
      calc(var(--gap) + var(--col,0) * (var(--cell) + var(--gap))),
      calc(var(--gap) + var(--row,0) * (var(--cell) + var(--gap)))
    );
    transition:transform 130ms cubic-bezier(.22,.8,.3,1);
    will-change:transform;
  }

  /* Kachel (Aussehen) */
  .tile-inner{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    border-radius:calc(var(--cell) * 0.14);
    font-weight:800;
    font-size:calc(var(--cell) * 0.42);
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
    background:#2a2f3f;
    color:#e8e9f3;
    will-change:transform;
    backface-visibility:hidden;
  }

  .tile-inner.len3{font-size:calc(var(--cell) * 0.33);}
  .tile-inner.len4{font-size:calc(var(--cell) * 0.26);}
  .tile-inner.len5{font-size:calc(var(--cell) * 0.20);}

  @keyframes appear{
    from{transform:scale(0);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  @keyframes pop{
    0%{transform:scale(1);}
    50%{transform:scale(1.18);}
    100%{transform:scale(1);}
  }
  .tile-inner.appear{animation:appear 170ms cubic-bezier(.2,.9,.3,1.2);}
  .tile-inner.merged{animation:pop 210ms ease-in-out;}

  /* Farben */
  .tile-inner[data-value="2"]{background:linear-gradient(160deg,#3a4055,#2c3143);color:#c9d1e6;}
  .tile-inner[data-value="4"]{background:linear-gradient(160deg,#465072,#363e5a);color:#dbe3f7;}
  .tile-inner[data-value="8"]{background:linear-gradient(160deg,#4f66b8,#3d4f94);color:#fff;}
  .tile-inner[data-value="16"]{background:linear-gradient(160deg,#5a6fe0,#4457bd);color:#fff;box-shadow:0 0 12px rgba(90,111,224,.28);}
  .tile-inner[data-value="32"]{background:linear-gradient(160deg,#7a5cf0,#5f45c9);color:#fff;box-shadow:0 0 15px rgba(122,92,240,.32);}
  .tile-inner[data-value="64"]{background:linear-gradient(160deg,#a855f7,#8b3fe0);color:#fff;box-shadow:0 0 18px rgba(168,85,247,.38);}
  .tile-inner[data-value="128"]{background:linear-gradient(160deg,#d946ef,#b52fd0);color:#fff;box-shadow:0 0 20px rgba(217,70,239,.42);}
  .tile-inner[data-value="256"]{background:linear-gradient(160deg,#ec4899,#c92f7d);color:#fff;box-shadow:0 0 22px rgba(236,72,153,.45);}
  .tile-inner[data-value="512"]{background:linear-gradient(160deg,#f43f5e,#d42a48);color:#fff;box-shadow:0 0 24px rgba(244,63,94,.5);}
  .tile-inner[data-value="1024"]{background:linear-gradient(160deg,#fb923c,#ea7a20);color:#fff;box-shadow:0 0 26px rgba(251,146,60,.5);}
  .tile-inner[data-value="2048"]{background:linear-gradient(160deg,#fbbf24,#f59e0b);color:#2b1a00;box-shadow:0 0 34px rgba(251,191,36,.7);}
  .tile-inner.big{background:linear-gradient(160deg,#22d3ee,#0891b2);color:#04222b;box-shadow:0 0 26px rgba(34,211,238,.55);}

  /* ---------- Overlay ---------- */
  .overlay{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px;
    background:rgba(10,10,18,.82);
    -webkit-backdrop-filter:blur(7px);
    backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;
    transition:opacity .28s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}

  .overlay h2{
    margin:0 0 6px;font-size:clamp(24px,7vw,34px);font-weight:900;
    background:linear-gradient(135deg,#a78bfa,#f472b6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    transform:scale(.85);opacity:0;
    transition:transform .32s cubic-bezier(.2,.9,.3,1.3), opacity .32s;
  }
  .overlay p{
    margin:0 0 18px;color:var(--muted);font-size:13.5px;
    transform:translateY(6px);opacity:0;
    transition:transform .32s ease .04s, opacity .32s ease .04s;
  }
  .overlay button{transform:scale(.9);opacity:0;transition:transform .32s ease .08s, opacity .32s ease .08s;}
  .overlay.show h2{transform:scale(1);opacity:1;}
  .overlay.show p{transform:translateY(0);opacity:1;}
  .overlay.show button{transform:scale(1);opacity:1;}

  .tip{
    text-align:center;color:var(--muted);font-size:11.5px;
    margin:14px 0 0;letter-spacing:.3px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div>
      <h1>2048</h1>
      <p class="subtitle">Verbinde gleiche Zahlen!</p>
    </div>
    <div class="scores">
      <div class="score-box">
        <div class="label">Punkte</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">Rekord</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="bar">
    <button id="new-game">Neues Spiel</button>
  </div>

  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Game Over</h2>
      <p id="overlay-text">Keine Züge mehr möglich.</p>
      <button id="overlay-btn">Nochmal</button>
    </div>
  </div>

  <p class="tip">Pfeiltasten / WASD · oder wischen</p>
</div>

<script>
(function () {
  'use strict';

  const SIZE = 4;

  const tilesEl       = document.getElementById('tiles');
  const gridEl        = document.getElementById('grid');
  const boardEl       = document.getElementById('board');
  const scoreEl       = document.getElementById('score');
  const bestEl        = document.getElementById('best');
  const overlayEl     = document.getElementById('overlay');
  const overlayTitle  = document.getElementById('overlay-title');
  const overlayText   = document.getElementById('overlay-text');
  const overlayBtn    = document.getElementById('overlay-btn');
  const newGameBtn    = document.getElementById('new-game');

  const VECTORS = {
    up:    [-1,  0],
    down:  [ 1,  0],
    left:  [ 0, -1],
    right: [ 0,  1]
  };

  let grid = [];
  let score = 0;
  let best = Number(localStorage.getItem('best2048') || 0);
  let idc = 0;
  let paused = false;
  let won = false;
  let overlayAction = 'restart';

  bestEl.textContent = best;

  /* ---------- Hintergrundzellen ---------- */
  for (let i = 0; i < SIZE * SIZE; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    gridEl.appendChild(d);
  }

  /* ---------- Hilfsfunktionen ---------- */
  function setPos(el, row, col) {
    el.style.setProperty('--row', row);
    el.style.setProperty('--col', col);
  }

  function setValue(inner, v) {
    inner.textContent = v;
    inner.dataset.value = v;
    inner.classList.toggle('big',  v > 2048);
    inner.classList.toggle('len3', v >= 128   && v < 1024);
    inner.classList.toggle('len4', v >= 1024  && v < 10000);
    inner.classList.toggle('len5', v >= 10000);
  }

  function createEl(tile, isNew) {
    const el = document.createElement('div');
    el.className = 'tile';
    setPos(el, tile.row, tile.col);

    const inner = document.createElement('div');
    inner.className = 'tile-inner';
    setValue(inner, tile.value);
    if (isNew) inner.classList.add('appear');

    inner.addEventListener('animationend', function () {
      inner.classList.remove('appear', 'merged');
    });

    el.appendChild(inner);
    tilesEl.appendChild(el);
    tile.el = el;
  }

  /* ---------- Spielzustand ---------- */
  function newGame() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    tilesEl.innerHTML = '';
    score = 0;
    idc = 0;
    won = false;
    paused = false;
    scoreEl.textContent = '0';
    overlayEl.classList.remove('show');
    addRandomTile();
    addRandomTile();
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) empty.push([r, c]);
      }
    }
    if (!empty.length) return;

    const [r, c] = empty[(Math.random() * empty.length) | 0];
    const tile = {
      id: ++idc,
      value: Math.random() < 0.9 ? 2 : 4,
      row: r,
      col: c,
      merged: false,
      el: null
    };
    grid[r][c] = tile;
    createEl(tile, true);
  }

  function addScore(n) {
    if (n <= 0) return;
    score += n;
    scoreEl.textContent = score;

    scoreEl.classList.remove('pop');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('pop');

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('best2048', best);
    }
  }

  function movesAvailable() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) return true;
        if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === t.value) return true;
        if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === t.value) return true;
      }
    }
    return false;
  }

  function hasReached2048() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] && grid[r][c].value >= 2048) return true;
      }
    }
    return false;
  }

  function showOverlay(title, text, btn, action) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayBtn.textContent = btn;
    overlayAction = action;
    overlayEl.classList.add('show');
  }

  /* ---------- Zug ausführen ---------- */
  function move(dir) {
    if (paused) return;

    const [dr, dc] = VECTORS[dir];

    let rows = [0, 1, 2, 3];
    let cols = [0, 1, 2, 3];
    if (dr > 0) rows = rows.slice().reverse();
    if (dc > 0) cols = cols.slice().reverse();

    // Merge-Markierungen zurücksetzen
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c]) grid[r][c].merged = false;
      }
    }

    let moved = false;
    let gained = 0;
    const absorbed = [];

    for (const r of rows) {
      for (const c of cols) {
        let tile = grid[r][c];
        if (!tile) continue;

        let nr = r;
        let nc = c;

        while (true) {
          const tr = nr + dr;
          const tc = nc + dc;

          if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;

          const other = grid[tr][tc];

          if (!other) {
            nr = tr;
            nc = tc;
            continue;
          }

          if (other.value === tile.value && !other.merged) {
            // Verschmelzen
            grid[r][c] = null;
            other.value *= 2;
            other.merged = true;
            gained += other.value;
            absorbed.push({ from: tile, to: other });
            tile = null;
            moved = true;
          }
          break;
        }

        if (tile && (nr !== r || nc !== c)) {
          grid[r][c] = null;
          grid[nr][nc] = tile;
          tile.row = nr;
          tile.col = nc;
          moved = true;
        }
      }
    }

    if (!moved) return;

    addScore(gained);

    // Aufgesogene Kacheln gleiten zur Zielposition und verschwinden
    for (let i = 0; i < absorbed.length; i++) {
      const from = absorbed[i].from;
      const to = absorbed[i].to;
      if (!from.el) continue;
      const el = from.el;
      setPos(el, to.row, to.col);
      el.style.zIndex = 0;
      from.el = null;
      setTimeout(function () { el.remove(); }, 150);
    }

    // Verbleibende Kacheln aktualisieren
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) continue;

        if (!t.el) {
          createEl(t, false);
          continue;
        }

        setPos(t.el, t.row, t.col);

        if (t.merged) {
          const inner = t.el.firstChild;
          setValue(inner, t.value);
          inner.classList.remove('appear', 'merged');
          void inner.offsetWidth;
          inner.classList.add('merged');
          t.merged = false;
        }
      }
    }

    addRandomTile();

    // Gewonnen?
    if (!won && hasReached2048()) {
      won = true;
      paused = true;
      showOverlay('Gewonnen! 🎉', 'Du hast die 2048-Kachel erreicht!', 'Weiterspielen', 'continue');
      return;
    }

    // Keine Züge mehr?
    if (!movesAvailable()) {
      paused = true;
      showOverlay('Game Over', 'Keine Züge mehr möglich.', 'Nochmal', 'restart');
    }
  }

  /* ---------- Steuerung ---------- */
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', a: 'left', s: 'down', d: 'right',
    W: 'up', A: 'left', S: 'down', D: 'right'
  };

  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const dir = KEYMAP[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  }, { passive: false });

  // Wischen
  let tsX = 0, tsY = 0, touching = false;

  boardEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    tsX = e.touches[0].clientX;
    tsY = e.touches[0].clientY;
    touching = true;
  }, { passive: true });

  boardEl.addEventListener('touchmove', function (e) {
    if (touching) e.preventDefault();
  }, { passive: false });

  boardEl.addEventListener('touchend', function (e) {
    if (!touching) return;
    touching = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - tsX;
    const dy = t.clientY - tsY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  /* ---------- Buttons ---------- */
  newGameBtn.addEventListener('click', newGame);

  overlayBtn.addEventListener('click', function () {
    if (overlayAction === 'continue') {
      overlayEl.classList.remove('show');
      paused = false;
    } else {
      newGame();
    }
  });

  /* ---------- Start ---------- */
  newGame();
})();
</script>
</body>
</html>
